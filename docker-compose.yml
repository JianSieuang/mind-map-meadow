services:
    ollama:
        volumes:
            - ./ollama_data:/root/.ollama
        container_name: local-ollama
        ports:
            - "127.0.0.1:${OLLAMA_PORT}:11434"
        image: ollama/ollama:latest
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    mind-map-meadow:
        build:
            context: ./mind-map-meadow
            dockerfile: Dockerfile
        container_name: game-meadow
        ports:
            - "127.0.0.1:${GAME_SERVER_PORT}:5000"
            - "127.0.0.1:${VITE_DEV_PORT}:5173"
        environment:
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
            - VITE_WATCH=true
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_ID_ANDROID=${GOOGLE_CLIENT_ID_ANDROID}
            - GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS}
            - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - SESSION_SECRET=${SESSION_SECRET}
        volumes:
            - ./mind-map-meadow:/app
            - /app/node_modules
            - /app/dist
        command: npm run dev
        restart: unless-stopped
        depends_on:
            - postgres-db
            - ollama

    postgres-db:
        image: pgvector/pgvector:pg16
        container_name: meadow-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"
        restart: unless-stopped

    # One compressed dump a day into ./backups/daily (gitignored), newest 14 kept. ops/backup.sh
    db-backup:
        image: pgvector/pgvector:pg16
        container_name: meadow-db-backup
        environment:
            PGHOST: postgres-db
            PGUSER: ${POSTGRES_USER}
            PGPASSWORD: ${POSTGRES_PASSWORD}
            PGDATABASE: ${POSTGRES_DB}
        volumes:
            - ./backups:/backups
            - ./ops/backup.sh:/backup.sh:ro
        entrypoint: ["/bin/sh", "/backup.sh"]
        restart: unless-stopped
        depends_on:
            - postgres-db

    db-viewer:
        image: adminer:latest
        container_name: meadow-db-viewer
        ports:
            - "127.0.0.1:${DB_VIEWER_PORT}:8080"
        restart: unless-stopped
        depends_on:
            - postgres-db
